name: Eco Route checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install pip==26.3
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -B -m unittest discover -s tests -v
      - name: Check that local secrets are not tracked
        run: |
          if git ls-files --error-unmatch .streamlit/secrets.toml >/dev/null 2>&1; then
            echo "Local Streamlit secrets must not be tracked."
            exit 1
          fi
  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pip==26.3 pip-audit==2.10.1
      - run: python -m pip_audit --strict --no-deps --disable-pip -r requirements.lock
